name: AccountPulse OVH Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: accountpulse-ovh-release
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bc5000
          POSTGRES_USER: bc5000
          POSTGRES_PASSWORD: bc5000
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bc5000 -d bc5000"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: Verify source and database migrations
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
        env:
          DATABASE_URL: postgres://bc5000:bc5000@localhost:5432/bc5000
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable images once
        run: |
          set -Eeuo pipefail
          docker build --pull --file apps/web/Dockerfile --tag accountpulse-web:${IMAGE_TAG} .
          docker build --pull --file apps/worker/Dockerfile --tag accountpulse-worker:${IMAGE_TAG} .
          docker save accountpulse-web:${IMAGE_TAG} | zstd -T0 -o accountpulse-web.tar.zst
          docker save accountpulse-worker:${IMAGE_TAG} | zstd -T0 -o accountpulse-worker.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: accountpulse-images-${{ github.sha }}
          path: accountpulse-*.tar.zst
          retention-days: 7
          if-no-files-found: error

  deploy-production:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: production
    env:
      OVH_HOST: ${{ vars.OVH_HOST }}
      OVH_PORT: ${{ vars.OVH_PORT }}
      OVH_USER: ${{ vars.OVH_USER }}
      OVH_DEPLOY_PATH: ${{ vars.OVH_DEPLOY_PATH }}
      HOSTNAME: ${{ vars.HOSTNAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: accountpulse-images-${{ github.sha }}
      - name: Install pinned OVH host key
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_HOST_KEY: ${{ secrets.OVH_SSH_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/id_accountpulse
          chmod 600 ~/.ssh/id_accountpulse
          printf '%s\n' "$OVH_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transfer immutable release bundle
        run: |
          set -Eeuo pipefail
          SSH=(ssh -i ~/.ssh/id_accountpulse -p "$OVH_PORT" "$OVH_USER@$OVH_HOST")
          SCP=(scp -i ~/.ssh/id_accountpulse -P "$OVH_PORT")
          "${SSH[@]}" "mkdir -p '$OVH_DEPLOY_PATH/artifacts/$IMAGE_TAG'"
          "${SCP[@]}" deploy/ovh/docker-compose.yml deploy/ovh/release.sh deploy/ovh/rollback.sh deploy/ovh/install-protected-environment.sh deploy/ovh/install-public-hostname.sh deploy/ovh/accountpulse-site.caddy "$OVH_USER@$OVH_HOST:$OVH_DEPLOY_PATH/"
          "${SCP[@]}" accountpulse-web.tar.zst accountpulse-worker.tar.zst "$OVH_USER@$OVH_HOST:$OVH_DEPLOY_PATH/artifacts/$IMAGE_TAG/"
      - name: Install protected production environment
        env:
          ACCOUNT_PULSE_LEGAL_ENTITY: ${{ vars.ACCOUNT_PULSE_LEGAL_ENTITY }}
          ACCOUNT_PULSE_SUPPORT_EMAIL: ${{ vars.ACCOUNT_PULSE_SUPPORT_EMAIL }}
          SMS_NUMBER_QUARANTINE_DAYS: ${{ vars.SMS_NUMBER_QUARANTINE_DAYS }}
          XERO_OAUTH_CLIENT_ID: ${{ secrets.XERO_OAUTH_CLIENT_ID }}
          XERO_OAUTH_CLIENT_SECRET: ${{ secrets.XERO_OAUTH_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SOLO_PRICE_ID: ${{ secrets.STRIPE_SOLO_PRICE_ID }}
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ secrets.STRIPE_PORTAL_CONFIGURATION_ID }}
        run: |
          set -Eeuo pipefail
          umask 077
          overlay=$(mktemp "$RUNNER_TEMP/accountpulse-commercial.XXXXXX")
          cleanup() { rm -f "$overlay"; }
          trap cleanup EXIT
          for name in ACCOUNT_PULSE_LEGAL_ENTITY ACCOUNT_PULSE_SUPPORT_EMAIL SMS_NUMBER_QUARANTINE_DAYS XERO_OAUTH_CLIENT_ID XERO_OAUTH_CLIENT_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_SOLO_PRICE_ID STRIPE_PORTAL_CONFIGURATION_ID; do
            value=${!name:-}
            [[ -n "$value" && "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
              echo "Protected production secret $name is missing or invalid." >&2
              exit 65
            }
            printf '%s=%s\n' "$name" "$value" >> "$overlay"
          done
          SSH=(ssh -i ~/.ssh/id_accountpulse -p "$OVH_PORT" "$OVH_USER@$OVH_HOST")
          "${SSH[@]}" "umask 077; cat > '$OVH_DEPLOY_PATH/.protected-commercial.env'" < "$overlay"
          "${SSH[@]}" "cd '$OVH_DEPLOY_PATH' && chmod 700 install-protected-environment.sh && ./install-protected-environment.sh '$OVH_DEPLOY_PATH/.protected-commercial.env'"
      - name: Install and verify public hostname
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_accountpulse -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "cd '$OVH_DEPLOY_PATH' && chmod 700 install-public-hostname.sh && ./install-public-hostname.sh '$HOSTNAME'"
      - name: Run migration and health-checked release
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_accountpulse -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "cd '$OVH_DEPLOY_PATH' && chmod 700 release.sh rollback.sh && ./release.sh '$IMAGE_TAG' '$HOSTNAME'"
      - name: Record rollback metadata
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_accountpulse -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "cat '$OVH_DEPLOY_PATH/releases/$IMAGE_TAG/release-metadata.json'" \
            > release-metadata-production.json
      - uses: actions/upload-artifact@v4
        with:
          name: accountpulse-release-production-${{ github.sha }}
          path: release-metadata-production.json
          retention-days: 90
