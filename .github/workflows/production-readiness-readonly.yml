name: AccountPulse production readiness read-only

on:
  push:
    branches: [codex/accountpulse-production-readiness]
    paths:
      - .github/workflows/production-readiness-readonly.yml
      - deploy/ovh/production-readiness-readonly.sh

permissions:
  contents: read

concurrency:
  group: accountpulse-ovh-release
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    env:
      OVH_HOST: ${{ vars.OVH_HOST }}
      OVH_PORT: ${{ vars.OVH_PORT }}
      OVH_USER: ${{ vars.OVH_USER }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check read-only probe syntax
        run: bash -n deploy/ovh/production-readiness-readonly.sh
      - name: Install existing pinned SSH access
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_HOST_KEY: ${{ secrets.OVH_SSH_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/id_accountpulse
          printf '%s\n' "$OVH_SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Read alert relay readiness and Solo rollout counts
        run: |
          set -Eeuo pipefail
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=8 -i ~/.ssh/id_accountpulse -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            'bash -s' < deploy/ovh/production-readiness-readonly.sh
