name: AccountPulse PostgreSQL restore drill

on:
  push:
    branches: [codex/accountpulse-restore-drill]
    paths:
      - .github/workflows/restore-drill.yml
      - deploy/ovh/restore-drill.py

permissions:
  contents: read

concurrency:
  group: accountpulse-ovh-release
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    env:
      OVH_HOST: ${{ vars.OVH_HOST }}
      OVH_PORT: ${{ vars.OVH_PORT }}
      OVH_USER: ${{ vars.OVH_USER }}
      OVH_DEPLOY_PATH: ${{ vars.OVH_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate restore drill script
        run: python3 -m py_compile deploy/ovh/restore-drill.py
      - name: Install existing pinned SSH access
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_HOST_KEY: ${{ secrets.OVH_SSH_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/id_accountpulse
          chmod 600 ~/.ssh/id_accountpulse
          printf '%s\n' "$OVH_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Restore the existing backup into isolated temporary PostgreSQL
        run: |
          set -Eeuo pipefail
          if [[ ! "$OVH_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo 'The protected OVH deployment directory is invalid.' >&2
            exit 1
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -i ~/.ssh/id_accountpulse -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "python3 - '$OVH_DEPLOY_PATH'" < deploy/ovh/restore-drill.py
