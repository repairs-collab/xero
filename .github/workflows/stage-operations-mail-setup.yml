name: Stage AccountPulse operations mail setup helper

on:
  push:
    branches: [codex/accountpulse-mail-setup]
    paths:
      - .github/workflows/stage-operations-mail-setup.yml
      - deploy/ovh/setup-operations-mail.py

permissions:
  contents: read

concurrency:
  group: accountpulse-ovh-release
  cancel-in-progress: false

jobs:
  stage-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    env:
      OVH_HOST: ${{ vars.OVH_HOST }}
      OVH_PORT: ${{ vars.OVH_PORT }}
      OVH_USER: ${{ vars.OVH_USER }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check interactive helper syntax
        run: python3 -m py_compile deploy/ovh/setup-operations-mail.py
      - name: Install existing pinned SSH access
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_HOST_KEY: ${{ secrets.OVH_SSH_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/id_accountpulse
          printf '%s\n' "$OVH_SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Stage one root-only helper without activating mail
        run: |
          set -Eeuo pipefail
          stage=$(cat <<'REMOTE'
          sudo -n -- /usr/bin/python3 -c '
          import fcntl
          import hashlib
          import os
          import stat
          import sys
          import tempfile

          target = "/run/ap-mail-setup"
          previous_sha256 = "4983edb0646613f7e4aa5383807aa34cdcd7a5e0407f25de89492a3b139e034e"

          def replace_previous(draft):
              flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC
              try:
                  existing = os.open(target, flags)
              except OSError:
                  raise SystemExit("MAIL_SETUP_EXISTING_HELPER_NOT_REPLACEABLE") from None
              with os.fdopen(existing, "rb") as source:
                  try:
                      fcntl.flock(source, fcntl.LOCK_EX | fcntl.LOCK_NB)
                  except BlockingIOError:
                      raise SystemExit("MAIL_SETUP_HELPER_ALREADY_IN_USE") from None
                  metadata = os.fstat(source.fileno())
                  if (not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0
                          or metadata.st_gid != 0 or stat.S_IMODE(metadata.st_mode) != 0o700
                          or hashlib.sha256(source.read(32769)).hexdigest() != previous_sha256):
                      raise SystemExit("MAIL_SETUP_EXISTING_HELPER_NOT_REPLACEABLE")
                  current = os.lstat(target)
                  if (current.st_dev, current.st_ino) != (metadata.st_dev, metadata.st_ino):
                      raise SystemExit("MAIL_SETUP_EXISTING_HELPER_NOT_REPLACEABLE")
                  os.replace(draft, target)

          if os.geteuid() != 0:
              raise SystemExit("MAIL_SETUP_STAGING_ROOT_REQUIRED")
          payload = sys.stdin.buffer.read(32769)
          if len(payload) > 32768 or not payload.startswith(b"#!/usr/bin/python3\n"):
              raise SystemExit("MAIL_SETUP_STAGING_INVALID_HELPER")
          draft_path = None
          try:
              with tempfile.NamedTemporaryFile(dir="/run", prefix=".ap-mail-setup-", delete=False) as draft:
                  draft_path = draft.name
                  draft.write(payload)
                  draft.flush()
                  os.fchown(draft.fileno(), 0, 0)
                  os.fchmod(draft.fileno(), 0o700)
                  os.fsync(draft.fileno())
              try:
                  os.link(draft_path, target)
              except FileExistsError:
                  replace_previous(draft_path)
          except OSError:
              raise SystemExit("MAIL_SETUP_STAGING_FAILED")
          finally:
              if draft_path is not None:
                  try:
                      os.unlink(draft_path)
                  except FileNotFoundError:
                      pass
          print("MAIL_SETUP_HELPER_STAGED")
          '
          REMOTE
          )
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=8 -i ~/.ssh/id_accountpulse -p "$OVH_PORT" "$OVH_USER@$OVH_HOST" \
            "$stage" < deploy/ovh/setup-operations-mail.py
