[general]
static = yes
writeprotect = yes
clearglobalvars = yes

[accountpulse-inbound]
exten => _X!,1,NoOp(AccountPulse private voice gateway leg)
 same => n,Answer()
 same => n,AMD(2500,1500,800,5000,100,50,4,256)
 same => n,Stasis(accountpulse-voice,provider-user,${ACCOUNT_PULSE_PROVIDER_USER_NUMBER},${AMDSTATUS})
 same => n,Hangup()

[accountpulse-rejected]
exten => _X!,1,Hangup()
